
server {
    listen 1313;
    server_name _;

    # Block the four specified forms
    location ~* ^/form/(allocation-standard|storage|allocation-purchase|allocation-instructional)/?$ {
        return 403;
    }

    # Forward everything else to Hugo
    location / {
        proxy_pass http://127.0.0.1:1314;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
